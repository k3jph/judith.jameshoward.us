name: One-time GitHub Flow branch cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-github-flow-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Archive human branch tips and delete listed old branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'dependabot/npm_and_yarn/baseline-browser-mapping-2.11.22'
            'dependabot/npm_and_yarn/browserslist-4.28.9'
            'dependabot/npm_and_yarn/fast-uri-3.1.9'
            'dependabot/npm_and_yarn/js-yaml-4.3.2'
            'dependabot/npm_and_yarn/multi-4b10dec7ea'
            'dependabot/npm_and_yarn/multi-05c505ab13'
            'dependabot/npm_and_yarn/multi-45a9cec3ad'
            'dependabot/npm_and_yarn/multi-da05789fd8'
            'dependabot/npm_and_yarn/multi-ebda847084'
            'dependabot/npm_and_yarn/nanoid-3.3.18'
            'dependabot/npm_and_yarn/next-16.4.2'
            'dependabot/npm_and_yarn/source-map-js-1.2.2'
            'dependabot/npm_and_yarn/vite-8.3.5'
          )
          for branch in "${branches[@]}"; do
            # The list is a snapshot from the pre-reset branch inventory.
            ref_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" 2>/dev/null) || { echo "Already absent: $branch"; continue; }
            sha=$(jq -r '.object.sha' <<< "$ref_json")
            if [[ "$branch" != dependabot/* ]]; then
              tag="archive/pre-github-flow-2026-11-03/${branch//\//-}"
              if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$tag" >/dev/null 2>&1; then
                gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" >/dev/null
              fi
              echo "Preserved $branch at $tag ($sha)"
            fi
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
            echo "Deleted $branch"
          done
      - name: Remove one-time cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-github-flow-cleanup.yml
          git commit -m "Remove one-time GitHub Flow cleanup workflow"
          git push origin HEAD:main
